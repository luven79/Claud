[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server pro přístup k datům z Garmin Connect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.20",
    "mcp>=2.3,<3",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-login = "garmin_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
