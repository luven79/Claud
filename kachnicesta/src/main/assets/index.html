<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
</head>
<body>
<title>Kachní cesta 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: HUD strip, full-width 3D stage, touch pad below. One deliberate daylight look. */
:root {
  --page: #142a1b; --ink: #f6f1d8; --muted: #b9c7a8; --sun: #ffd23f;
  --panel: #1f3d28; --edge: #2f5a3b; --danger: #ff6b5a;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #1d3a25 0%, var(--page) 60%); color: var(--ink); font-family: var(--display);
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none; overscroll-behavior: none;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.title { font-weight: 700; font-size: 1.4rem; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.title span { color: var(--sun); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { background: var(--panel); border: 1px solid var(--edge); border-radius: 99px; padding: 4px 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill b { color: var(--ink); }
.lives { display: flex; gap: 5px; }
.lives svg { width: 22px; height: 22px; }
.lives svg.lost { opacity: .25; filter: grayscale(1); }
.timebar { height: 10px; border-radius: 99px; background: var(--panel); overflow: hidden; border: 1px solid var(--edge); }
.timebar div { height: 100%; width: 100%; background: linear-gradient(90deg, #ffb703, var(--sun)); transform-origin: left; }
.timebar div.low { background: linear-gradient(90deg, #e63946, var(--danger)); }
.stage { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 3px #0e1f14; background: #9fd7f0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 700; font-size: 1.5rem; color: var(--sun); text-shadow: 0 2px 0 #3a2a00, 0 0 6px rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; }
.overlay {
  position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 16px; justify-content: flex-start; background: linear-gradient(rgba(12,28,18,.82), rgba(12,28,18,.55) 55%, rgba(12,28,18,0) 75%);
}
.overlay h2 { margin: 0; font-size: 2.3rem; color: var(--sun); text-shadow: 0 3px 0 #7a5a00; }
.overlay p { margin: 0; max-width: 300px; line-height: 1.45; font-weight: 500; }
.btn { font-family: var(--display); font-weight: 700; font-size: 1.15rem; padding: 12px 34px; border-radius: 99px; border: none; background: var(--sun); color: #2b2106; cursor: pointer; box-shadow: 0 5px 0 #c89b00; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c89b00; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pad { display: grid; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(2, 54px); gap: 8px; justify-content: center; }
.pad button { border: 2px solid var(--edge); background: linear-gradient(#26492f, var(--panel)); color: var(--ink); border-radius: 16px; font-size: 1.4rem; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 0 #0e1f14; }
.pad button:active { transform: translateY(2px); box-shadow: 0 2px 0 #0e1f14; }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.help { color: var(--muted); font-size: .85rem; text-align: center; line-height: 1.4; }
.err { color: var(--danger); text-align: center; }
.animals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 320px; }
.animals button { display: flex; align-items: center; gap: 6px; padding: 8px 8px; border-radius: 12px; border: 2px solid var(--edge); background: var(--panel); color: var(--ink); font-family: var(--display); font-size: .9rem; cursor: pointer; min-width: 0; }
.animals button i { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset -2px -2px 0 rgba(0,0,0,.2); }
.animals button[aria-pressed="true"] { border-color: var(--sun); background: #3a5a2b; }
</style>

<div class="wrap">
  <div class="hud">
    <div class="title">Kachní <span>cesta</span></div>
    <div class="stats">
      <span class="pill">Body <b id="score">0</b></span>
      <span class="pill">Rekord <b id="best">0</b></span>
      <span class="pill">Kolo <b id="level">1</b></span>
    </div>
    <div class="lives" id="lives" aria-label="Životy"></div>
  </div>
  <div class="timebar" aria-hidden="true"><div id="time"></div></div>
  <div class="stage" id="stage">
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Kachní cesta</h2>
      <p id="ovText">Vyber si zvířátko a doveď ho přes silnice, koleje a potoky do hnízd. Pozor na lekníny, které se třesou.</p>
      <div class="animals" id="animals" role="group" aria-label="Vyber zvířátko"></div>
      <button class="btn" id="startBtn" type="button">Hrát</button>
    </div>
  </div>
  <div class="pad" aria-label="Ovládání">
    <button class="up" type="button" data-d="up" aria-label="Nahoru">▲</button>
    <button class="left" type="button" data-d="left" aria-label="Doleva">◀</button>
    <button class="down" type="button" data-d="down" aria-label="Dolů">▼</button>
    <button class="right" type="button" data-d="right" aria-label="Doprava">▶</button>
  </div>
  <div class="help">Ovládání: přejetí prstem po hrací ploše, ťuknutí = skok vpřed, nebo tlačítka. Na počítači šipky, mezerník pozastaví hru.</div>
</div>

<script src="three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) { $("ovText").textContent = "3D knihovnu se nepodařilo načíst. Zkus aplikaci zavřít a znovu otevřít."; $("startBtn").hidden = true; return; }

  // ================= GAME RULES (grid) =================
  // Layout from the nests (row 0) down to the start (last row): two rivers, two roads, grass between
  const SEGMENTS_DEF = [
    { type: "river", lanes: [
      { speed: 1.2, dir: 1,  len: 3, n: 3, kind: "raft" },
      { speed: 1.6, dir: -1, len: 2, n: 4, kind: "lily", sink: true },
      { speed: 0.9, dir: 1,  len: 4, n: 2, kind: "log" },
      { speed: 1.4, dir: -1, len: 3, n: 3, kind: "lily", sink: true } ] },
    { type: "grass" },
    { type: "road", lanes: [
      { dir: 1,  n: 3, kind: "mixed" },
      { dir: -1, n: 3, kind: "mixed" },
      { dir: 1,  n: 3, kind: "mixed" },
      { dir: -1, n: 3, kind: "mixed" } ] },
    { type: "grass" },
    { type: "rail", lanes: [
      { speed: 13, dir: 1, len: 9, n: 1, kind: "train" } ] },
    { type: "grass" },
    { type: "river", lanes: [
      { speed: 1.1, dir: 1,  len: 3, n: 3, kind: "raft" },
      { speed: 1.5, dir: -1, len: 2, n: 4, kind: "lily", sink: true },
      { speed: 0.8, dir: 1,  len: 5, n: 2, kind: "log" },
      { speed: 1.9, dir: 1,  len: 2, n: 3, kind: "raft" },
      { speed: 1.2, dir: -1, len: 3, n: 3, kind: "lily", sink: true } ] },
    { type: "grass" },
    { type: "road", lanes: [
      { dir: -1, n: 3, kind: "mixed" },
      { dir: 1,  n: 3, kind: "mixed" },
      { dir: -1, n: 3, kind: "mixed" },
      { dir: 1,  n: 3, kind: "mixed" },
      { dir: -1, n: 3, kind: "mixed" } ] },
    { type: "grass" },
  ];
  const SEGMENTS = [], LANES = [];
  { let r = 1;
    for (const d of SEGMENTS_DEF) {
      const n = d.lanes ? d.lanes.length : 1;
      SEGMENTS.push({ type: d.type, r0: r, n });
      if (d.lanes) d.lanes.forEach((l, i) => LANES.push({ ...l, row: r + i, type: d.type }));
      r += n;
    } }
  const ROWS = SEGMENTS[SEGMENTS.length - 1].r0 + 1, START_ROW = ROWS - 1;
  const COLS = 11, NEST_COLS = [1, 3, 5, 7, 9];
  const TIME_LIMIT = 60, PERIOD = COLS + 6;
  const CAR_COLORS = [0xff5a4e, 0x4ea8ff, 0xb07cff, 0xff7fc8, 0x3fe0c5, 0xf4f4f0, 0xffa62b];

  let state = "menu", lanes = [], duck, nests, score = 0, best = 0, level = 1, lives = 3, timeLeft = TIME_LIMIT, furthest, dieTimer = 0, dieKind = "", clock = 0, shake = 0;
  try { best = +localStorage.getItem("kachni-best") || 0; } catch (e) {}
  const rand = (a, b) => a + Math.random() * (b - a);
  const laneAt = row => lanes.find(l => l.row === row);
  function lilyState(it) { if (!it.sinks) return "up"; const t = (clock + it.phase) % 6; return t < 4 ? "up" : t < 4.9 ? "sinking" : "under"; }

  // ================= THREE SETUP =================
  const stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd7f0);
  scene.fog = new THREE.Fog(0x9fd7f0, 24, 45);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x55703a, 0.62));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.72);
  sun.position.set(-6, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
  sun.shadow.bias = -0.0008;
  scene.add(sun); scene.add(sun.target);

  const matCache = {};
  const M = (color, opts = {}) => {
    const key = color + JSON.stringify(opts);
    return matCache[key] || (matCache[key] = new THREE.MeshLambertMaterial({ color, ...opts }));
  };
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  function box(w, h, d, color, x = 0, y = 0, z = 0, parent, opts) {
    const m = new THREE.Mesh(boxGeo, M(color, opts));
    m.scale.set(w, h, d); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    if (parent) parent.add(m);
    return m;
  }
  function cyl(rt, rb, h, color, seg = 12, parent) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(color));
    m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m;
  }
  // world coords: x = cells (0..11), z = row (0..13), y up. Cell centre = (col + .5, row + .5)
  const cz = row => row + 0.5;

  // ---------- static world ----------
  const world = new THREE.Group(); scene.add(world);
  function groundStrip(row, color, h = 0.3, y = -0.15, width = 40) {
    return box(width, h, 1, color, COLS / 2, y, cz(row), world);
  }
  // reed bank row 0, hill behind the nests, meadow behind the start
  groundStrip(0, 0x4f8f3a);
  box(40, 0.6, 8, 0x5ea83a, COLS / 2, 0, -4, world);
  box(40, 0.6, 8, 0x6cb04a, COLS / 2, -0.15, ROWS + 3.5, world);
  const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .6 });
  const sparks = [], waters = [];
  function riverBlock(r0, n) {
    const zc = r0 + n / 2;
    box(40, 0.2, n, 0x2b5a55, COLS / 2, -0.55, zc, world);
    const w = new THREE.Mesh(new THREE.PlaneGeometry(40, n, 40, n * 2), new THREE.MeshPhongMaterial({ color: 0x2aa0c0, transparent: true, opacity: 0.85, shininess: 90, specular: 0x99e6ff }));
    w.rotation.x = -Math.PI / 2; w.position.set(COLS / 2, -0.18, zc); w.receiveShadow = true; world.add(w);
    waters.push({ mesh: w, base: w.geometry.attributes.position.array.slice() });
    box(40, 0.34, 0.12, 0x6b5a3a, COLS / 2, -0.15, r0 + 0.02, world);
    box(40, 0.34, 0.12, 0x6b5a3a, COLS / 2, -0.15, r0 + n - 0.02, world);
    for (let i = 0; i < n * 9; i++) {
      const sp = new THREE.Mesh(new THREE.PlaneGeometry(.25, .04), sparkMat.clone());
      sp.rotation.x = -Math.PI / 2; sp.position.set(rand(-5, 16), -0.12, rand(r0 + .2, r0 + n - .2));
      sp.userData = { v: rand(-.3, .3), ph: rand(0, 6) }; sparks.push(sp); world.add(sp);
    }
  }
  function roadBlock(r0, n) {
    box(40, 0.3, n, 0x3d424b, COLS / 2, -0.17, r0 + n / 2, world);
    for (const z of [r0 + 0.02, r0 + n - 0.02]) box(40, 0.36, 0.1, 0xd9d9d0, COLS / 2, -0.1, z, world);
    const mid = r0 + Math.floor(n / 2);
    for (let r = r0 + 1; r < r0 + n; r++) {
      if (r === mid) { box(40, 0.02, 0.05, 0xf2c230, COLS / 2, -0.015, r - 0.04, world); box(40, 0.02, 0.05, 0xf2c230, COLS / 2, -0.015, r + 0.04, world); continue; }
      for (let x = -14; x < 26; x++) box(0.55, 0.02, 0.06, 0xf0f0e8, x + 0.5, -0.015, r, world);
    }
  }
  const signalLights = [];
  function railBlock(r0) {
    const z = cz(r0);
    box(40, 0.24, 0.96, 0x8a7f72, COLS / 2, -0.14, z, world);          // gravel bed
    for (let x = -14; x < 26; x += 0.5) box(0.16, 0.06, 0.82, 0x6b4a2b, x, 0.0, z, world);   // sleepers
    for (const dz of [-0.24, 0.24]) box(40, 0.07, 0.06, 0xb8bec6, COLS / 2, 0.06, z + dz, world);   // rails
    for (const x of [0.25, COLS - 0.25]) {
      const g = new THREE.Group(); g.position.set(x, 0, z - 0.62); g.scale.setScalar(1.6); world.add(g);
      box(0.08, 1.1, 0.08, 0xeeeeee, 0, 0.55, 0, g);
      box(0.34, 0.18, 0.08, 0x222222, 0, 1.05, 0, g);
      const cross1 = box(0.5, 0.06, 0.03, 0xffffff, 0, 0.82, 0.05, g); cross1.rotation.z = .6;
      const cross2 = box(0.5, 0.06, 0.03, 0xffffff, 0, 0.82, 0.05, g); cross2.rotation.z = -.6;
      for (const dx of [-0.09, 0.09]) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), new THREE.MeshLambertMaterial({ color: 0x551111, emissive: 0x000000 }));
        lamp.position.set(dx, 1.05, 0.06); g.add(lamp); signalLights.push({ lamp, odd: dx > 0 });
      }
    }
  }
  function grassRow(row) {
    groundStrip(row, 0x7fc94f);
    for (let i = 0; i < 40; i++) {
      const x = rand(-8, 19), z = cz(row) + rand(-0.4, 0.4);
      if (Math.random() < .5) box(0.08, 0.12, 0.08, [0xffffff, 0xffe45c, 0xff9ecf, 0xb9a6ff][i % 4], x, 0.06, z, world);
      else box(0.14, 0.1, 0.14, 0x5aa036, x, 0.05, z, world);
    }
  }
  // darken outside playfield
  const shadeMat = new THREE.MeshBasicMaterial({ color: 0x0b1d10, transparent: true, opacity: 0.28, depthWrite: false });
  for (const x of [-10, COLS + 10]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(20, ROWS), shadeMat); s.rotation.x = -Math.PI / 2; s.position.set(x, 0.2, ROWS / 2); s.renderOrder = 5; world.add(s); }

  // trees, bushes, fence, house decor
  function tree(x, z, s = 1) {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
    box(0.25, 0.8, 0.25, 0x7a4f24, 0, 0.4, 0, g);
    box(0.9, 0.6, 0.9, 0x3f8f35, 0, 1.0, 0, g); box(0.65, 0.5, 0.65, 0x56a845, 0, 1.45, 0, g); box(0.35, 0.3, 0.35, 0x6cc255, 0, 1.8, 0, g);
    world.add(g); return g;
  }
  function bush(x, z) { const g = new THREE.Group(); g.position.set(x, 0, z); box(0.6, 0.4, 0.5, 0x3f8f35, 0, 0.2, 0, g); box(0.35, 0.3, 0.35, 0x56a845, 0.15, 0.45, 0, g); world.add(g); }
  function house(x, z, roof) {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    box(2, 1.3, 1.6, 0xf3ead6, 0, 0.65, 0, g);
    const r = new THREE.Mesh(new THREE.ConeGeometry(1.6, 0.9, 4), M(roof)); r.rotation.y = Math.PI / 4; r.position.y = 1.75; r.scale.set(1, 1, 0.8); r.castShadow = true; g.add(r);
    box(0.35, 0.6, 0.05, 0x7a4f24, 0.4, 0.3, 0.81, g); box(0.35, 0.35, 0.05, 0x9fd7f0, -0.45, 0.8, 0.81, g);
    world.add(g);
  }
  for (let i = 0; i < 7; i++) { tree(rand(-6, 16), rand(-7, -1.2), rand(.9, 1.4)); }
  for (let i = 0; i < 6; i++) tree(-1.6 - Math.random() * 3, rand(ROWS + .2, ROWS + 6), rand(.9, 1.3));
  for (let i = 0; i < 6; i++) tree(COLS + 1.6 + Math.random() * 3, rand(ROWS + .2, ROWS + 6), rand(.9, 1.3));
  house(-3.5, ROWS + 2.8, 0xc0392b); house(COLS + 3.5, ROWS + 2.5, 0x2c6e9b);
  for (let x = -6; x < COLS + 6; x += 0.6) { box(0.08, 0.4, 0.08, 0xe8dcc0, x, 0.2, ROWS + .2, world); }
  box(COLS + 12, 0.06, 0.05, 0xe8dcc0, COLS / 2, 0.32, ROWS + .2, world);
  for (const sgm of SEGMENTS) {
    if (sgm.type === "river") riverBlock(sgm.r0, sgm.n);
    else if (sgm.type === "road") roadBlock(sgm.r0, sgm.n);
    else if (sgm.type === "rail") railBlock(sgm.r0);
    else {
      grassRow(sgm.r0);
      for (const x of [-1.3, -2.6, COLS + 1.3, COLS + 2.7]) if (Math.random() < .7) bush(x, cz(sgm.r0));
      if (sgm.r0 !== START_ROW) { tree(-3.6 - Math.random() * 2, cz(sgm.r0), 1.1); tree(COLS + 3.6 + Math.random() * 2, cz(sgm.r0), 1.1); }
    }
  }

  // reeds & nests (row 0)
  const reeds = [];
  for (let i = 0; i < 70; i++) {
    const x = rand(-6, COLS + 6);
    if (NEST_COLS.some(c => Math.abs(x - (c + .5)) < .55)) continue;
    const h = rand(.5, 1.1), g = new THREE.Group(); g.position.set(x, 0, cz(0) + rand(-.35, .35));
    box(0.05, h, 0.05, Math.random() > .5 ? 0x2e6b28 : 0x5f9e45, 0, h / 2, 0, g);
    if (Math.random() < .3) box(0.09, 0.22, 0.09, 0x6b3f1f, 0, h, 0, g);
    g.userData.phase = Math.random() * 6; reeds.push(g); world.add(g);
  }
  const nestGroups = NEST_COLS.map(c => {
    const g = new THREE.Group(); g.position.set(c + .5, 0, cz(0));
    const pond = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, .05, 20), new THREE.MeshPhongMaterial({ color: 0x1f84a8, shininess: 80 }));
    pond.position.y = -0.0; pond.receiveShadow = true; g.add(pond);
    const nest = new THREE.Mesh(new THREE.TorusGeometry(.28, .1, 8, 16), M(0x9a6a35)); nest.rotation.x = Math.PI / 2; nest.position.y = .08; nest.castShadow = true; g.add(nest);
    cyl(.24, .24, .06, 0x5a3814, 12, g).position.y = .05;
    const eggs = new THREE.Group(); g.add(eggs);
    for (const dx of [-.08, .09]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), M(0xf4f0e0)); e.scale.y = 1.25; e.position.set(dx, .14, 0); e.castShadow = true; eggs.add(e); }
    world.add(g); return { g, eggs, chick: null };
  });

  // ---------- models ----------
  const ANIMALS = [
    { id: "duck", name: "Kachňátko", css: "#ffd23f", fur: 0xffe066 },
    { id: "rabbit", name: "Zajíček", css: "#d9d4cc", fur: 0xf4f1ea },
    { id: "hedgehog", name: "Ježek", css: "#8a6a4a", fur: 0x5a3f2a },
    { id: "pig", name: "Prasátko", css: "#ffb3c1", fur: 0xffb3c1 },
    { id: "cat", name: "Kotě", css: "#f4a742", fur: 0xf4a742 },
    { id: "fox", name: "Liška", css: "#e8692a", fur: 0xe8692a },

    for (const w of waters) {
      const pos = w.mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const bx = w.base[i * 3], by = w.base[i * 3 + 1];
        pos.array[i * 3 + 2] = Math.sin(bx * .9 + clock * 2) * .03 + Math.cos(by * 1.7 + clock * 1.5) * .03;
      }
      pos.needsUpdate = true;
    }
    for (const s of sparks) { s.position.x += s.userData.v * dt; if (s.position.x > 16) s.position.x = -5; if (s.position.x < -5) s.position.x = 16; s.material.opacity = .15 + .45 * Math.max(0, Math.sin(clock * 2 + s.userData.ph)); }
    for (const r of reeds) r.rotation.z = Math.sin(clock * 1.6 + r.userData.phase) * .08;
    nestGroups.forEach((n, i) => { if (n.chick.visible) n.chick.userData.body.rotation.z = Math.sin(clock * 3 + i) * .05; });

    // player
    if (duck) {
      const h = duck.hop, lift = Math.sin(h * Math.PI);
      const px = duck.fromX + (duck.x - duck.fromX) * h + .5, pr = duck.fromRow + (duck.row - duck.fromRow) * h;
      let py = lift * .55;
      const lane = laneAt(duck.row);
      if (h === 1 && lane && lane.type === "river") py = .02 + Math.sin(clock * 2) * .02;
      if (h === 1 && duck.row === 0) py = .1;
      const target = FACE[duck.face];
      let d = target - faceAngle; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      faceAngle += d * Math.min(1, dt * 18);
      player.rotation.set(0, state === "menu" || state === "over" ? Math.PI + Math.sin(clock * .8) * .6 : faceAngle, 0);
      const b = player.userData.body;
      let ox = null, oz = null; popAmount = 0;
      if (state === "dying") {
        const k = Math.min(1, dieT / (DIE_TIME[dieKind] || 1.2));
        player.visible = true;
        if (dieKind === "car") {
          // launched up and towards the viewer, spinning, getting bigger
          const e = k * k * (3 - 2 * k), toCam = camera.position.clone().sub(dieFrom);
          const p = dieFrom.clone().add(toCam.multiplyScalar(e * .82));
          ox = p.x; oz = p.z; py = p.y + Math.sin(k * Math.PI) * 2.5;
          player.rotation.set(k * 14, faceAngle + k * 9, k * 6);
          player.scale.setScalar(1 + e * 1.6);
          if (k > .93) player.visible = false;
        } else if (dieKind === "train") {
          const tl = dieTrain ? dieTrain.lane : null;
          py = .55; player.rotation.set(0, tl && tl.v > 0 ? -Math.PI / 2 : Math.PI / 2, Math.sin(clock * 20) * .1);
          player.scale.set(1.15, 1.1, .45);
        } else if (dieKind === "truck") {
          const f = Math.min(1, dieT / .08);
          player.scale.set(1 + f * .7, Math.max(.05, 1 - f), 1 + f * .7); py = .01;
          player.visible = dieT < 1.2;
        } else if (dieKind === "bike") {
          const t = Math.min(1, toss.t / .55);
          ox = toss.fromX + (toss.toX - toss.fromX) * t + .5;
          oz = cz(toss.fromRow + (toss.toRow - toss.fromRow) * t);
          py = Math.sin(t * Math.PI) * 1.6;
          player.rotation.set(t * 6.3, faceAngle, t < 1 ? t * 3 : Math.PI / 2);
          if (t >= 1) { py = .18; player.rotation.set(0, faceAngle + Math.sin(clock * 6) * .3, Math.PI / 2); }
        } else if (dieKind === "water") {
          const t = dieT; hippoAnim(t);
          const mouth = atSnout(.75, .55);
          if (t < .5) { py = -.05 + Math.sin(clock * 14) * .05; player.rotation.z = Math.sin(clock * 16) * .35; { const a = atSnout(.3); ox = a.x; oz = a.z; } }
          else if (t < .85) {
            const q = (t - .5) / .35, start = atSnout(.3, 0);
            const p = start.lerp(mouth, q); ox = p.x; oz = p.z; py = p.y + Math.sin(q * Math.PI) * .8;
            player.rotation.set(q * 7, faceAngle, 0); player.scale.setScalar(1 - q * .25);
          } else {
            // body inside the closed jaws, only the head pokes out; eyes shoot out; then down with the hippo
            const sq = t < .95 ? (t - .85) / .1 : 1;
            // held crosswise: head sticks out of one side of the mouth, bottom and kicking feet out of the other
            // body inside the mouth, head poking out of the side of the jaws towards the camera
            const toCamH = new THREE.Vector3(camera.position.x - hippoAt.x, 0, camera.position.z - hippoAt.z).normalize();
            { const a = atSnout(.72).add(toCamH.clone().multiplyScalar(.42)); ox = a.x; oz = a.z; } py = hippo.position.y + .08 + Math.sin(t * 9) * .015;
            player.rotation.set(Math.sin(t * 17) * .06, Math.atan2(-toCamH.x, -toCamH.z) + Math.sin(t * 7) * .12, Math.sin(t * 13) * .05);
            player.scale.set(.6, .6 - sq * .08, .6);
            const kick = Math.sin(t * 26) * .9;
            for (const n of ["fl", "fr"]) { const f = player.getObjectByName(n); if (f) { f.rotation.x = n === "fl" ? kick : -kick; f.position.y = .03 + Math.abs(kick) * .04; } }
            const under = Math.max(0, (t - 2.6) / .6);
            popAmount = t < 1.0 ? 0 : Math.max(0, 1 - under); popT = t - 1.0;
            if (hippo.position.y < -.95) player.visible = false;
            if (t >= 2.45 && t < 2.48) { const a = atSnout(.6); burst(a.x, a.z, .1, "splash"); }
          }
          if (t >= .5 && t < .53) burst(hippoAt.x, hippoAt.z, .1, "splash");
        }
        else { player.rotation.y = faceAngle + k * 12; py = Math.sin(k * Math.PI) * .5; }
      } else {
        const sq = 1 + lift * .15; player.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
        const wl = b.getObjectByName("wl"), wr = b.getObjectByName("wr"), el = b.getObjectByName("el"), er = b.getObjectByName("er");
        if (wl) { wl.rotation.z = lift * .9; wr.rotation.z = -lift * .9; }
        if (el) { el.rotation.x = lift * .6 + Math.sin(clock * 2) * .05; er.rotation.x = lift * .6 + Math.sin(clock * 2 + 1) * .05; }
        b.rotation.z = h === 1 ? Math.sin(clock * 3) * .03 : 0;
      }
      player.position.set(ox !== null ? ox : px, py, oz !== null ? oz : cz(pr));
      placePopEyes(popAmount, popT);
      blob.position.set(px, .01, cz(pr)); blob.scale.setScalar(1 - lift * .35); blob.visible = !(lane && lane.type === "river" && h === 1) && state !== "dying";

      // camera follows the duck in depth
      showcase = state === "menu" || state === "over";
      closeUp = state === "dying" && dieKind === "water" && dieT > .35 && dieT < 3.3;
      const wantZ = showcase ? cz(pr) - 0.75 : closeUp ? hippoAt.z + .45 : Math.min(ROWS - 5.4, Math.max(4.4, cz(pr) - 3.2));
      const wantX = showcase ? px : closeUp ? hippoAt.x + .05 : COLS / 2 + 0.7;
      camTarget.z += (wantZ - camTarget.z) * Math.min(1, dt * 4);
      camTarget.x += (wantX - camTarget.x) * Math.min(1, dt * 4);
      camTarget.y += ((closeUp ? .45 : 0) - camTarget.y) * Math.min(1, dt * 4);
    }
    const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
    const fullDist = Math.max(9, (COLS / 2 + 0.6) / Math.tan(hf / 2), 5.6 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    camDist += ((showcase ? 4.4 : closeUp ? 5 : fullDist) - camDist) * Math.min(1, dt * (closeUp ? 6 : 4) || 1);
    const dist = camDist;
    const wantOff = showcase ? new THREE.Vector3(0, .87, .5) : closeUp ? new THREE.Vector3(1, .42, .75) : new THREE.Vector3(.14, .9, .4);
    camOff.lerp(wantOff.normalize(), Math.min(1, dt * 3 || 1)).normalize();
    const off = camOff.clone().multiplyScalar(dist);
    camera.position.copy(camTarget).add(off);
    if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(shake * .4));
    camera.lookAt(camTarget);
    sun.position.set(camTarget.x - 6, 14, camTarget.z + 6); sun.target.position.copy(camTarget);
    renderer.render(scene, camera);
  }

  // ================= UI =================
  const DUCK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 4.5 7 4.5c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 3.8 0 6 3.8 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff6b8a"/></svg>';
  function showOverlay(t, p, b) { $("ovTitle").textContent = t; $("ovText").textContent = p; $("startBtn").textContent = b; $("animals").hidden = state === "paused"; $("overlay").hidden = false; }
  ANIMALS.forEach(a => {
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.a = a.id;
    const dot = document.createElement("i"); dot.style.background = a.css; btn.append(dot, a.name);
    btn.addEventListener("click", () => setAnimal(a.id));
    $("animals").appendChild(btn);
  });
  function hideOverlay() { $("overlay").hidden = true; }
  function updateHud() {
    $("score").textContent = score; $("best").textContent = best; $("level").textContent = level;
    $("lives").innerHTML = [0, 1, 2].map(i => DUCK_SVG.replace("<svg", `<svg class="${i >= lives ? "lost" : ""}"`)).join("");
  }
  function togglePause() {
    if (state === "play") { state = "paused"; showOverlay("Pauza", "Hra stojí. Pokračuj tlačítkem nebo libovolným pohybem.", "Pokračovat"); }
    else if (state === "paused") { state = "play"; hideOverlay(); }
  }
  addEventListener("keydown", e => {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    else if (e.key === " ") { e.preventDefault(); togglePause(); }
    else if (e.key === "Enter" && (state === "menu" || state === "over")) newGame();
  });
  document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); move(b.dataset.d); }));
  const cvs = renderer.domElement; let sx = 0, sy = 0, st = 0;
  cvs.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  cvs.addEventListener("pointerup", e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) { if (performance.now() - st < 300) move("up"); return; }
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left"); else move(dy > 0 ? "down" : "up");
  });
  $("startBtn").addEventListener("click", () => { if (state === "paused") { state = "play"; hideOverlay(); } else newGame(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") togglePause(); });
  // Android back button (APK): pause a running game, otherwise let the app close
  window.onAndroidBack = () => { if (state === "play" || state === "dying") { if (state === "play") togglePause(); return true; } return false; };

  // ================= LOOP =================
  spawnLurkers();
  nests = [false, true, false, false, false]; setAnimal(animalId); syncNests(); buildLanes(); resetDuck(); updateHud(); layout();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (state !== "paused") { update(dt); updateParticles(dt); }
    render(state === "paused" ? 0 : dt);
    if (state === "play" || state === "dying") { const f = Math.max(0, timeLeft / TIME_LIMIT), bar = $("time"); bar.style.transform = `scaleX(${f})`; bar.className = f < .25 ? "low" : ""; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
