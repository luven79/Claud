name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test game logic
        run: ./gradlew :game:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: piskvorky-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk piskvorky.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest piskvorky.apk --clobber
          else
            gh release create latest piskvorky.apk \
              --target "$GITHUB_SHA" \
              --title "Piškvorky" \
              --notes "Stáhněte soubor piskvorky.apk do telefonu a otevřete ho – tím se aplikace nainstaluje."
          fi
